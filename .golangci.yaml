version: "2"
linters:
  default: all
  disable:
    - gomodguard  # deprecated
    - nlreturn
    - prealloc
    - revive      # TODO: has to be turned on
    - wsl
    - wsl_v5
  settings:
    cyclop:
      max-complexity: 50
    funlen:
      lines: 150
      statements: 150
    lll:
      line-length: 160
    depguard:
      rules:
        test:
          files:
            - "$test"
          allow:
            - "$gostd"
            - github.com/michurin/systemd-env-file/sdenv
            - github.com/stretchr/testify/
    varnamelen:
      max-distance: 120
    goconst:
      ignore-tests: true
  exclusions:
    generated: lax
    warn-unused: true
    rules:
      - path: cmd/xenv/main.go
        linters:
          - gosec
      - path: cmd/xenv/main.go
        source: "\\sfmt\\.Fprint(ln|f)\\("
        linters:
          - errcheck
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/michurin/systemd-env-file)
